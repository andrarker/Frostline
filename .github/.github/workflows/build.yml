name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -q frostline-app.zip
      - working-directory: frostline-app
        run: |
          npm install
          npm run setup
          npx cap add android
          npm run assets
          npm run sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: frostline-apk
          path: frostline-app/android/app/build/outputs/apk/debug/app-debug.apk
